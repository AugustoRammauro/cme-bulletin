name: CME daily bulletin

on:
  schedule:
    - cron: "7,37 15-20 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cme-bulletin
  cancel-in-progress: false

jobs:
  collect:
    timeout-minutes: 35
    runs-on: ubuntu-24.04            # pinned: ubuntu-latest broke this on 19 Oct 2026
    steps:
      - uses: actions/checkout@v7      # pinned: see README maintenance note

      - uses: actions/setup-python@v7  # pinned: see README maintenance note
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch bulletin and append rows
        run: python run_daily.py

      - name: Commit history
        run: |
          if [[ -n "$(git status --porcelain history.csv)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add history.csv
            git commit -m "data: bulletin rows $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No new rows to commit."
          fi
