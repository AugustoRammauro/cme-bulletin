name: CME daily bulletin

on:
  schedule:
    - cron: "0,15,30,45 15-20 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cme-bulletin
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch bulletin and append rows
        run: python run_daily.py

      - name: Commit history
        run: |
          if [[ -n "$(git status --porcelain history.csv)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add history.csv
            git commit -m "data: bulletin rows $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No new rows to commit."
          fi
