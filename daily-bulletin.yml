name: CME daily bulletin

# The bulletin turns FINAL around 10:00 CT, i.e. 15:00 UTC in CDT and 16:00
# UTC in CST, so the window below covers both.
#
# GitHub's scheduler is best-effort: it delays ticks and silently drops them
# under load, and it throttles frequent schedules hardest. Measured on this
# repo, a every-15-minutes schedule delivered 2 of 24 ticks in a day. So this
# asks for FEWER ticks - twice an hour, on off-congestion minutes rather than
# on the hour - and run_daily.py polls internally for 25 minutes on each one.
# One surviving tick is then enough to capture the day.
on:
  schedule:
    - cron: "7,37 15-20 * * 1-5"
  workflow_dispatch:                     # lets you run it by hand from the UI

permissions:
  contents: write                        # to commit history.csv

concurrency:
  group: cme-bulletin                    # never two runs writing at once
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35     # above the 25-minute polling budget
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch bulletin and append rows
        run: python run_daily.py --wait-minutes 25

      - name: Commit history
        run: |
          if [[ -n "$(git status --porcelain history.csv)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add history.csv
            git commit -m "data: bulletin rows $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No new rows to commit."
          fi
